name: Backend checks

on:
  push:
    branches: ["feat/alpha-foundation", "feat/lxmf-live-messenger"]
  pull_request:
    branches: ["dev"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend, test, and optional mesh dependencies
        run: python -m pip install -e "./backend[test,mesh]"
      - name: Verify messenger CLI entrypoint
        run: python backend/scripts/ua_messenger.py --help
      - name: Run backend tests
        run: python -m pytest backend/tests -q

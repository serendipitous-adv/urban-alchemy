name: Android Messenger

on:
  pull_request:
    paths:
      - "android-messenger/**"
      - ".github/workflows/android-messenger.yml"
  push:
    branches: [dev]
    paths:
      - "android-messenger/**"
      - ".github/workflows/android-messenger.yml"
  workflow_dispatch:

jobs:
  debug-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-messenger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run LXMF bridge unit tests
        run: python -m unittest discover -s tests -v
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: urban-alchemy-messenger-preview
          path: android-messenger/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  signed-release:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-messenger
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Check whether signing is configured
        id: signing
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.enabled == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        if: steps.signing.outputs.enabled == 'true'
        with:
          python-version: "3.11"
      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.enabled == 'true'
        with:
          packages: platform-tools
      - name: Install Android SDK
        if: steps.signing.outputs.enabled == 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        if: steps.signing.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore private signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/urban-alchemy-release.p12
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Assemble signed stable APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/urban-alchemy-release.p12
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload stable APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: urban-alchemy-messenger-stable
          path: android-messenger/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

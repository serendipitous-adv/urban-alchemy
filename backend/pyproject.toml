[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-alchemy-alpha"
version = "0.1.0"
description = "Urban Alchemy alpha domain and quest ledger"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "cryptography>=43,<47",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
mesh = ["rns>=1.6,<2", "lxmf>=1.3,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
